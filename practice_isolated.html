                            <button type="button" onclick="triggerIndividualAmountChange(${idx}, 1)" class="w-6 h-6 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded border border-gray-300 text-xs flex items-center justify-center">+</button>
                        </div>
                    </div>
                `;
            }).join('');

            badgeContainer.innerHTML = html;
        }

        function triggerIndividualAmountChange(idx, diff) {
            if (!APP_STATE.isFullyDecomposed) {
                pendingIndividualAction = () => {
                    executeIndividualAmountChange(idx, diff);
                };
                document.getElementById('confirm-modal').classList.remove('hidden');
            } else {
                executeIndividualAmountChange(idx, diff);
            }
        }

        function triggerIndividualAmountInput(idx, val) {
            if (!APP_STATE.isFullyDecomposed) {
                pendingIndividualAction = () => {
                    executeIndividualAmountInput(idx, val);
                };
                document.getElementById('confirm-modal').classList.remove('hidden');
            } else {
                executeIndividualAmountInput(idx, val);
            }
        }

        function confirmExpansionOK() {
            document.getElementById('confirm-modal').classList.add('hidden');
            if (pendingCartAction) {
                const action = pendingCartAction;
                pendingCartAction = null;
                action();
                return;
            }
            APP_STATE.isFullyDecomposed = true;
            if (pendingIndividualAction) pendingIndividualAction();
            pendingIndividualAction = null;
            updateCombinationsMath();
        }

        function confirmExpansionCancel() {
            document.getElementById('confirm-modal').classList.add('hidden');
            pendingIndividualAction = null;
            pendingCartAction = null;
            renderExpandedItems();
            renderCartModalItems();
            renderBatchItems();
        }

        function executeIndividualAmountChange(idx, diff) {
            if (!APP_STATE.expandedItems[idx]) {
                APP_STATE.expandedItems[idx] = { amount: getCurrentUnitAmount() };
            }
            let cur = APP_STATE.expandedItems[idx].amount || getCurrentUnitAmount();
            cur = Math.max(1, cur + diff);
            APP_STATE.expandedItems[idx].amount = cur;
            renderExpandedItems();
            updateTotalCostDisplay();
        }

        function executeIndividualAmountInput(idx, val) {
            let num = Math.max(1, parseInt(val) || 1);
            if (!APP_STATE.expandedItems[idx]) APP_STATE.expandedItems[idx] = {};
            APP_STATE.expandedItems[idx].amount = num;
            renderExpandedItems();
            updateTotalCostDisplay();
        }

        function updateTotalCostDisplay() {
            const combos = calculateCombinations();
            let totalCost = 0;
            if (APP_STATE.currentTicket === "tansho_fukusho") {
                APP_STATE.selection.singleSelected.forEach(h => {
                    const amt = (APP_STATE.singleCustomAmounts[h] !== undefined ? APP_STATE.singleCustomAmounts[h] : getCurrentUnitAmount()) * 100;
                    totalCost += amt;
                });
            } else if (APP_STATE.isFullyDecomposed || APP_STATE.isExpanded) {
                APP_STATE.expandedItems.forEach(item => {
                    totalCost += (item.amount || getCurrentUnitAmount()) * 100;
                });
            } else {
                const unit = getCurrentUnitAmount() * 100;
                totalCost = combos.length * unit;
            }
            document.getElementById('preview-summary-text').innerText = `${combos.length}点 計 ${totalCost.toLocaleString()}円`;
        }

        function addCurrentToCart() {
            const place = document.getElementById('race-place').value;
            if (!place || !APP_STATE.raceNumber) {
                alert("レース場とR番号を選択してください。");
                return;
            }

            const combos = calculateCombinations();
            if (combos.length === 0) {
                alert("買い目が選択されていません。");
                return;
            }

            let ticketKey = APP_STATE.currentTicket;
            if (ticketKey === "tansho_fukusho") ticketKey = APP_STATE.singleType;

            // カート追加時点の各買い目の購入単位を確定して保存する。
            const savedItems = combos.map((combo, idx) => {
                let amountUnits;
                if (APP_STATE.currentTicket === 'tansho_fukusho') {
                    const horse = combo[0];
                    amountUnits = APP_STATE.singleCustomAmounts[horse] !== undefined
                        ? APP_STATE.singleCustomAmounts[horse]
                        : getCurrentUnitAmount();
                } else if (APP_STATE.expandedItems[idx]?.amount !== undefined) {
                    amountUnits = APP_STATE.expandedItems[idx].amount;
                } else {
                    amountUnits = getCurrentUnitAmount();
                }
                return { combo: cloneData(combo), amount: Math.max(1, Number(amountUnits) || 1) };
            });

            const newCartItem = {
                id: Date.now(),
                date: APP_STATE.currentDate,
                place: place,
                rNum: APP_STATE.raceNumber,
                horseCount: APP_STATE.horseCount,
                ticket: ticketKey,
                subMode: APP_STATE.subMode,
                compact: APP_STATE.currentTicket !== 'tansho_fukusho',
                displayExpanded: false,
                isDecomposed: false,
                isMulti: APP_STATE.isMulti,
                selection: cloneData(APP_STATE.selection),
                items: savedItems,
                combos: cloneData(combos),
                totalPoints: combos.length,
                totalAmount: savedItems.reduce((sum, item) => sum + item.amount * 100, 0)
            };

            if (ticketKey === 'tansho' || ticketKey === 'fukusho') {
                // 単勝・複勝は同じレース・券種なら追加回数にかかわらず1ブロックにまとめる。
                const existing = APP_STATE.cart.find(group =>
                    group.date === newCartItem.date && group.place === newCartItem.place &&
                    Number(group.rNum) === Number(newCartItem.rNum) && group.ticket === ticketKey
                );
                if (existing) {
                    const combined = [...(existing.combos || []).map((combo, idx) => ({
                        combo: cloneData(combo), item: cloneData(existing.items?.[idx] || { amount: 1 })
                    })), ...newCartItem.combos.map((combo, idx) => ({
                        combo: cloneData(combo), item: cloneData(newCartItem.items[idx])
                    }))];
                    combined.sort((a, b) => Number(a.combo[0]) - Number(b.combo[0]));
                    existing.combos = combined.map(x => x.combo);
                    existing.items = combined.map(x => x.item);
                    existing.totalPoints = existing.combos.length;
                    existing.totalAmount = existing.items.reduce((sum, item) => sum + Math.max(1, Number(item.amount) || 1) * 100, 0);
                    existing.horseCount = newCartItem.horseCount;
                } else {
                    APP_STATE.cart.push(newCartItem);
                }
            } else {
                APP_STATE.cart.push(newCartItem);
            }
            saveToLocalStorage();
            updateCartBadge();

            // 追加後も現在の券種・買い方・選択チェックを維持する。
            // 券種を切り替えた場合は switchTicket() 側で選択がリセットされる。
            updateCombinationsMath();
        }

        function updateCartBadge() {
            const place = document.getElementById('race-place').value;
            const rNum = APP_STATE.raceNumber;
            const currentRaceItems = APP_STATE.cart.filter(item => item.date === APP_STATE.currentDate && item.place === place && item.rNum === rNum);
            
            let totalPoints = 0;
            currentRaceItems.forEach(group => {
                totalPoints += group.combos.length;
            });

            document.getElementById('cart-badge').innerText = `${totalPoints}点`;
        }

        function openCartModal() {
            const place = document.getElementById('race-place').value;
            if (!place || !APP_STATE.raceNumber) {
                alert("レース場とR番号を選択してください。");
                return;
            }
            renderCartModalItems();
            document.getElementById('cart-modal').classList.remove('hidden');
        }

        function closeCartModal() {
            document.getElementById('cart-modal').classList.add('hidden');
        }

        function renderCompactGroupSelection(group) {
            const selection = group.selection || {};
            const count = Number(group.horseCount) || 18;
            const renderBadges = (label, numbers) => {
                const nums = (numbers || []).slice().sort((a, b) => a - b);
                if (!nums.length) return '';
                const badges = nums.map(num => {
                    const frame = group.ticket === 'wakuren' ? Number(num) : getFrameNumber(num, count);
                    const style = FRAME_COLORS[frame - 1] || FRAME_COLORS[0];
                    return `<span class="w-6 h-6 flex items-center justify-center rounded ${style.bg} font-bold text-xs shadow-sm shrink-0">${num}</span>`;
                }).join(' ');
                return `<div class="flex items-center justify-between py-1 border-b border-gray-100"><div class="flex items-center gap-2"><span class="horse-badge-arrow">${label}</span><div class="flex flex-wrap gap-1">${badges}</div></div></div>`;
            };
            let rows = '';
            if (group.subMode === 'formation') {
                rows += renderBadges('馬1', selection.pos1);
                rows += renderBadges('馬2', selection.pos2);
                if (group.ticket === 'sanrenfuku' || group.ticket === 'sanrentan') rows += renderBadges('馬3', selection.pos3);
            } else if (group.subMode === 'box') {
                rows += renderBadges('選択', selection.boxSelected);
            } else if (group.subMode === 'nagashi') {
                rows += renderBadges('軸', selection.axis == null ? [] : [selection.axis]);
                if (selection.axis2 != null) rows += renderBadges('軸2', [selection.axis2]);
                rows += renderBadges('相手', selection.opponents);
            } else {
                rows += renderBadges('選択', selection.singleSelected || selection.boxSelected || []);
            }
            return `<div class="bg-gray-50 p-2.5 rounded-lg border border-gray-200">${rows}<div class="text-right pt-2"><span class="text-xs font-bold text-gray-800">${group.combos.length}点</span></div></div>`;

        function renderCartSelectionPanel(group, groupIdx) {
            const items = group.items || [];
            const firstAmount = items.length ? Math.max(1, Number(items[0].amount) || 1) : 1;
            const sameAmount = items.every(item => (Number(item.amount) || 1) === firstAmount);
            const amountValue = sameAmount ? `value="${firstAmount}"` : 'placeholder="混在"';
            return `<div class="bg-white p-2.5 rounded-lg border border-gray-200">
                <div class="flex items-center justify-between gap-2 mb-2">
                    <span class="text-xs font-bold text-gray-700">${group.subMode === 'formation' ? 'フォーメーション' : group.subMode === 'box' ? 'ボックス' : group.subMode === 'nagashi' ? 'ながし' : '買い目'}</span>
                    <div class="flex items-center gap-1 shrink-0">
                        <span class="text-xs font-bold text-gray-600">各</span>
                        <button type="button" onclick="adjustCartGroupAmount(${groupIdx}, -1)" class="w-6 h-6 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded border border-gray-300">-</button>
                        <div class="flex items-center border border-gray-300 rounded px-1.5 py-0.5 bg-white"><input type="number" min="1" step="1" ${amountValue} onchange="setCartGroupAmount(${groupIdx}, this.value)" class="w-10 text-right text-xs font-bold focus:outline-none"><span class="text-[11px] font-bold ml-0.5">00円</span></div>
                        <button type="button" onclick="adjustCartGroupAmount(${groupIdx}, 1)" class="w-6 h-6 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded border border-gray-300">+</button>
                    </div>
                </div>
                ${renderCompactGroupSelection(group)}
            </div>
            <button type="button" onclick="${group.displayExpanded ? `collapseCartGroup(${groupIdx})` : `expandCartGroup(${groupIdx})`}" class="w-full mt-2 py-1.5 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold text-xs">
                ${group.displayExpanded ? '展開を閉じる' : '展開する'} <i class="fa-solid ${group.displayExpanded ? 'fa-chevron-up' : 'fa-chevron-down'}"></i>
            </button>`;
        }

        function renderCartModalItems() {
            const container = document.getElementById('cart-modal-items');
            const place = document.getElementById('race-place').value;
            const rNum = APP_STATE.raceNumber;
            const ticketOrder = ['tansho', 'fukusho', 'wakuren', 'umaren', 'wide', 'umatan', 'sanrenfuku', 'sanrentan'];
            const currentRaceItems = APP_STATE.cart
                .map((item, originalIndex) => ({ item, originalIndex }))
                .filter(entry => entry.item.date === APP_STATE.currentDate && entry.item.place === place && entry.item.rNum === rNum)
                .sort((a, b) => {
                    const ai = ticketOrder.indexOf(a.item.ticket);
                    const bi = ticketOrder.indexOf(b.item.ticket);
                    const ar = ai < 0 ? ticketOrder.length : ai;
                    const br = bi < 0 ? ticketOrder.length : bi;
                    return ar - br || a.originalIndex - b.originalIndex;
                })
                .map(entry => entry.item);
            if (currentRaceItems.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-gray-400 text-sm font-bold">このレースの買い目はありません</div>`;
                document.getElementById('cart-modal-summary-count').innerText = `0組 0点`;
                document.getElementById('cart-modal-summary-cost').innerText = `合計 0円`;
                return;

            let totalPoints = 0, totalCost = 0;

        // 組み合わせの個別編集を初めて行うときだけ、フォーメーションの個別展開を確認する。
        function requestCartIndividualAction(groupIdx, action) {
            const group = APP_STATE.cart[groupIdx];
            if (!group) return;
            if (group.compact && !group.isDecomposed) {
                pendingCartAction = () => {
                    const current = APP_STATE.cart[groupIdx];
                    if (!current) return;
                    // 個別編集へ移行したら、買い目作成エリアと同様に
                    // フォーメーション概要（一括金額設定を含む）を隠して組み合わせだけ表示する。
                    current.isDecomposed = true;
                    current.displayExpanded = true;
                    action();
                    renderCartModalItems();
                    renderBatchItems();
                    updateCartBadge();
                };
                document.getElementById('confirm-modal').classList.remove('hidden');
                return;
            }
            action();
        }
        function adjustCartGroupAmount(groupIdx, diff) {
            const group = APP_STATE.cart[groupIdx]; if (!group) return;
            const cur = Math.max(1, Number(group.items?.[0]?.amount) || 1), next = Math.max(1, cur + diff);
            group.items = group.combos.map(combo => ({ combo: cloneData(combo), amount: next }));
            saveToLocalStorage(); renderCartModalItems(); updateCartBadge();
        }
        function setCartGroupAmount(groupIdx, value) {
            const group = APP_STATE.cart[groupIdx]; if (!group) return;
            const next = Math.max(1, parseInt(value) || 1);
            group.items = group.combos.map(combo => ({ combo: cloneData(combo), amount: next }));
            saveToLocalStorage(); renderCartModalItems(); updateCartBadge();
        }

        function adjustCartSingleAmount(groupIdx, comboIdx, diff) {
            const group = APP_STATE.cart[groupIdx];
            if (!group) return;
            if (!group.items[comboIdx]) group.items[comboIdx] = { amount: 1 };
            let cur = group.items[comboIdx].amount || 1;
            cur = Math.max(1, cur + diff);
            group.items[comboIdx].amount = cur;
            saveToLocalStorage();
            renderCartModalItems();
            updateCartBadge();
        }

        function setCartSingleAmount(groupIdx, comboIdx, val) {
            const group = APP_STATE.cart[groupIdx];
            if (!group) return;

            let num = Math.max(1, parseInt(val) || 1);
            group.items[comboIdx].amount = num;
            saveToLocalStorage();
            renderCartModalItems();
            updateCartBadge();

        function removeSingleComboItem(groupIdx, comboIdx) {
            const group = APP_STATE.cart[groupIdx];
            if (!group) return;
            group.combos.splice(comboIdx, 1);

        function executeBatchAction(skipExpansionConfirm = false) {
            const itemChecks = [...document.querySelectorAll('.batch-item-checkbox:checked')];
            const groupChecks = [...document.querySelectorAll('.batch-group-checkbox:checked')];
            if (!itemChecks.length && !groupChecks.length) { alert("項目が選択されていません。"); return; }
            const groupsNeedingDecomposition = [...new Set(itemChecks
                .map(cb => parseInt(cb.dataset.groupIdx))
                .filter(gIdx => APP_STATE.cart[gIdx]?.compact && !APP_STATE.cart[gIdx]?.isDecomposed))];
            if (!skipExpansionConfirm && groupsNeedingDecomposition.length) {
                pendingCartAction = () => {
                    groupsNeedingDecomposition.forEach(gIdx => {
                        if (APP_STATE.cart[gIdx]) {
                            APP_STATE.cart[gIdx].isDecomposed = true;
                            APP_STATE.cart[gIdx].displayExpanded = true;
                        }
                    });
                    executeBatchAction(true);
                };
                document.getElementById('confirm-modal').classList.remove('hidden');
                return;
            }
            if (currentBatchMode === 'amount') {
                const targetAmount = Math.max(1, parseInt(document.getElementById('batch-input-amount').value) || 1);
                groupChecks.forEach(cb => {
                    const gIdx = parseInt(cb.dataset.groupIdx), group = APP_STATE.cart[gIdx];
                    if (group) group.items = group.combos.map(combo => ({ combo: cloneData(combo), amount: targetAmount }));
                });
                itemChecks.forEach(cb => {
                    const gIdx = parseInt(cb.dataset.groupIdx), cIdx = parseInt(cb.dataset.comboIdx);
                    if (APP_STATE.cart[gIdx]?.items[cIdx]) APP_STATE.cart[gIdx].items[cIdx].amount = targetAmount;
                });
            } else if (currentBatchMode === 'delete') {
                const deleteGroups = new Set(groupChecks.map(cb => parseInt(cb.dataset.groupIdx)));
                const targets = itemChecks.map(cb => ({ gIdx: parseInt(cb.dataset.groupIdx), cIdx: parseInt(cb.dataset.comboIdx) }));
                targets.sort((a,b) => a.gIdx === b.gIdx ? b.cIdx-a.cIdx : b.gIdx-a.gIdx).forEach(t => {
                    if (APP_STATE.cart[t.gIdx] && !deleteGroups.has(t.gIdx)) {
                        APP_STATE.cart[t.gIdx].combos.splice(t.cIdx,1); APP_STATE.cart[t.gIdx].items.splice(t.cIdx,1);
                        APP_STATE.cart[t.gIdx].totalPoints = APP_STATE.cart[t.gIdx].combos.length;
                        APP_STATE.cart[t.gIdx].totalAmount = (APP_STATE.cart[t.gIdx].items || []).reduce((sum, item) => sum + Math.max(1, Number(item.amount) || 1) * 100, 0);
                    }
                });
                [...deleteGroups].sort((a,b)=>b-a).forEach(idx => { if (APP_STATE.cart[idx]) APP_STATE.cart.splice(idx,1); });
                APP_STATE.cart = APP_STATE.cart.filter(g => g.combos.length > 0);
            }
            saveToLocalStorage(); updateCartBadge(); renderCartModalItems(); closeBatchModal();
        }

        function handleResultTableKeyNavigation(e, currentInput) {
            const inputs = Array.from(document.querySelectorAll('.result-input'));
            const idx = inputs.indexOf(currentInput);
            if (idx === -1) return;

            let targetIdx = null;

            if (e.key === 'Enter') {
                e.preventDefault();
                targetIdx = (idx + 1) % inputs.length;
            } else if (e.key === 'ArrowRight') {
                if (idx % 2 === 0) {
                    e.preventDefault();
                    targetIdx = idx + 1;
                }
            } else if (e.key === 'ArrowLeft') {
                if (idx % 2 === 1) {
                    e.preventDefault();
                    targetIdx = idx - 1;
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (idx + 2 < inputs.length) targetIdx = idx + 2;
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (idx - 2 >= 0) targetIdx = idx - 2;
            }

            if (targetIdx !== null && inputs[targetIdx]) {
                inputs[targetIdx].focus();
                inputs[targetIdx].select();
            }
        }

        function saveResultInput(el) {
            const ticket = el.getAttribute('data-ticket');
            const field = el.getAttribute('data-field');
            const subidx = el.getAttribute('data-subidx');
            const val = el.value;

            if (ticket === 'fukusho') {
                if (field === 'horse') APP_STATE.results.fukusho.horses[subidx] = val;
                else APP_STATE.results.fukusho.payouts[subidx] = val;
            } else if (ticket === 'wide') {
                if (field === 'combo') APP_STATE.results.wide.combos[subidx] = val;
                else APP_STATE.results.wide.payouts[subidx] = val;
            } else {
                if (field === 'horse') {
                    APP_STATE.results[ticket].combo = val;
                    APP_STATE.results[ticket].horse = val;
                } else {
                    APP_STATE.results[ticket].payout = val;
                }
            }
            setCurrentRaceResults(APP_STATE.results);
            saveToLocalStorage();
        }

        function normalizeResultCombo(value, unordered = false) {
            const nums = String(value || '').match(/\d+/g) || [];
            return unordered ? nums.sort((a, b) => Number(a) - Number(b)).join('-') : nums.join('-');
        }

        function calculateRacePayout(record) {
            let payoutTotal = 0;
            const results = record.results || {};
            const unorderedTickets = new Set(['wakuren', 'umaren', 'wide', 'sanrenfuku']);
            (record.cart || []).forEach(group => {
                const ticket = group.ticket;
                const result = results[ticket];
                if (!result) return;
                (group.combos || []).forEach((combo, idx) => {
                    const item = group.items?.[idx] || { amount: 1 };
                    const stakeUnits = Number(item.amount) || 1;
                    let matchedPayout = 0;
                    if (ticket === 'fukusho') {
                        const winning = (result.horses || []).map((h, i) => ({ combo: normalizeResultCombo(h), payout: parseInt(String(result.payouts?.[i] || '').replace(/,/g, ''), 10) || 0 }));
                        const horse = normalizeResultCombo(combo[0]);
                        matchedPayout = winning.find(x => x.combo === horse)?.payout || 0;
                    } else if (ticket === 'wide') {
                        const bet = normalizeResultCombo(combo, true);
                        const winning = (result.combos || []).map((c, i) => ({ combo: normalizeResultCombo(c, true), payout: parseInt(String(result.payouts?.[i] || '').replace(/,/g, ''), 10) || 0 }));
                        matchedPayout = winning.find(x => x.combo === bet)?.payout || 0;
                    } else {
                        const winningText = result.horse ?? result.combo ?? '';
                        const bet = normalizeResultCombo(combo, unorderedTickets.has(ticket));
                        const winning = normalizeResultCombo(winningText, unorderedTickets.has(ticket));
                        matchedPayout = bet && bet === winning ? (parseInt(String(result.payout || '').replace(/,/g, ''), 10) || 0) : 0;
                    }
                    if (matchedPayout > 0) payoutTotal += matchedPayout * stakeUnits;
                });
            });
            return payoutTotal;
        }

        async function calculateSummary() {
            const type = APP_STATE.dateFilterType;
            const targetDate = APP_STATE.currentDate;

            let totalPurchase = 0;
            let totalPayout = 0;

            const records = await getAllHistoryRecords().catch(() => HISTORY_RECORDS);
            HISTORY_RECORDS = records || [];
            const merged = new Map(HISTORY_RECORDS.map(r => [r.key, r]));
            const activePlace = document.getElementById('race-place')?.value || APP_STATE.racePlace || '';
            const activeKey = raceKey(APP_STATE.currentDate, activePlace, APP_STATE.raceNumber);
            const activeRecord = merged.get(activeKey) || { key: activeKey, date: APP_STATE.currentDate, place: activePlace, rNum: APP_STATE.raceNumber, cart: [], results: null };
            activeRecord.results = cloneData(APP_STATE.results);
            // 現在選択中のレースはlocalStorageの状態を正とし、削除も集計へ即時反映する。
            activeRecord.cart = cloneData((APP_STATE.cart || []).filter(x =>
                raceKey(x.date, x.place, x.rNum) === activeKey
            ));
            merged.set(activeKey, activeRecord);

            for (const record of merged.values()) {
                const date = record.date || '';
                let match = false;
                if (type === '日別') match = date === targetDate;
                else if (type === '月別') match = date.slice(0, 7) === targetDate.slice(0, 7);
                else if (type === '年別') match = date.slice(0, 4) === targetDate.slice(0, 4);
                if (!match) continue;

                if (!Number(record.horseCount)) {
                    record.horseCount = Number(record.cart?.find(x => Number(x.horseCount))?.horseCount) || null;
                }
                const financials = buildRaceFinancials(record);
                record.bets = financials.bets;
                record.totalPurchase = financials.totalPurchase;
                record.totalPayout = financials.totalPayout;
                record.balance = financials.balance;
                totalPurchase += record.totalPurchase;
                totalPayout += record.totalPayout;
            }

            document.getElementById('summary-purchase-display').innerText = `${totalPurchase.toLocaleString()}円`;
            document.getElementById('summary-payout-display').innerText = `${totalPayout.toLocaleString()}円`;
            const net = totalPayout - totalPurchase;
            document.getElementById('balance-total-display').innerText = `${net.toLocaleString()} 円`;
        }

        function parseAiResultText() {
            const text = document.getElementById('ai-result-textarea').value;
            if (!text.trim()) {
                alert("解析するテキストを入力してください。");
                return;
            }

            APP_STATE.results = {
                tansho: { horse: "", payout: "" },
                fukusho: { horses: ["", "", ""], payouts: ["", "", ""] },
                wakuren: { combo: "", payout: "" },
                umaren: { combo: "", payout: "" },
                wide: { combos: ["", "", ""], payouts: ["", "", ""] },
                umatan: { combo: "", payout: "" },
                sanrenfuku: { combo: "", payout: "" },
                sanrentan: { combo: "", payout: "" }
            };

            const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            let currentTicket = null;
            let fukushoHorseIdx = 0;
            let fukushoPayoutIdx = 0;
            let wideComboIdx = 0;
            let widePayoutIdx = 0;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i];

                if (line.includes('単勝')) { currentTicket = 'tansho'; line = line.replace(/.*?単勝/, '').trim(); }
                else if (line.includes('複勝')) { currentTicket = 'fukusho'; line = line.replace(/.*?複勝/, '').trim(); }
                else if (line.includes('枠連')) { currentTicket = 'wakuren'; line = line.replace(/.*?[-\s]*枠連/, '').trim(); }
                else if (line.includes('馬連')) { currentTicket = 'umaren'; line = line.replace(/.*?[-\s]*馬連/, '').trim(); }
                else if (line.includes('ワイド')) { currentTicket = 'wide'; line = line.replace(/.*?[-\s]*ワイド/, '').trim(); }
                else if (line.includes('馬単')) { currentTicket = 'umatan'; line = line.replace(/.*?[-\s]*馬単/, '').trim(); }
                else if (line.includes('3連複') || line.includes('三連複')) { currentTicket = 'sanrenfuku'; line = line.replace(/.*?[-\s]*(3連複|三連複)/, '').trim(); }
                else if (line.includes('3連単') || line.includes('三連単')) { currentTicket = 'sanrentan'; line = line.replace(/.*?[-\s]*(3連単|三連単)/, '').trim(); }

                if (!line && i < lines.length - 1) continue;

                const moneyMatch = line.match(/([0-9,]+)\s*円/);
                if (moneyMatch) {
                    const payoutVal = moneyMatch[1];
                    if (currentTicket === 'fukusho') {
                        if (fukushoPayoutIdx < 3) APP_STATE.results.fukusho.payouts[fukushoPayoutIdx++] = payoutVal;
                    } else if (currentTicket === 'wide') {
                        if (widePayoutIdx < 3) APP_STATE.results.wide.payouts[widePayoutIdx++] = payoutVal;
                    } else if (currentTicket) {
                        APP_STATE.results[currentTicket].payout = payoutVal;
                    }
                    continue;
                }

                if (line.includes('人気')) continue;

                const comboMatch = line.match(/^[-–—\s]*([0-9]{1,2}(?:[\s\-–—]+[0-9]{1,2})*)/);
                if (comboMatch) {
                    let numStr = comboMatch[1].trim();
                    numStr = numStr.replace(/[\s\-–—]+/g, '-');

                    if (currentTicket === 'fukusho') {
                        if (fukushoHorseIdx < 3) APP_STATE.results.fukusho.horses[fukushoHorseIdx++] = numStr;
                    } else if (currentTicket === 'wide') {
                        if (wideComboIdx < 3) APP_STATE.results.wide.combos[wideComboIdx++] = numStr;
                    } else if (currentTicket) {
                        APP_STATE.results[currentTicket].horse = numStr;
                        APP_STATE.results[currentTicket].combo = numStr;
                    }
                }
            }

            renderResultTable();
            saveToLocalStorage();
            alert("結果データを自動解析・入力しました。");
        }

        // CSVのセルを安全に分解する（引用符内のカンマ・改行・二重引用符に対応）
        function parseCSV(text) {
            const rows = [];
            let row = [], cell = '', quoted = false;
            for (let i = 0; i < text.length; i++) {
                const ch = text[i];
                if (quoted) {
                    if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; }
                    else if (ch === '"') quoted = false;
                    else cell += ch;
                } else if (ch === '"') quoted = true;
                else if (ch === ',') { row.push(cell); cell = ''; }
                else if (ch === '\n') { row.push(cell.replace(/\r$/, '')); rows.push(row); row = []; cell = ''; }
                else cell += ch;
            }
            if (cell.length || row.length) { row.push(cell.replace(/\r$/, '')); rows.push(row); }
            return rows;
        }

        function csvEscape(value) {
            const text = value == null ? '' : String(value);
            return '"' + text.replace(/"/g, '""') + '"';
        }

        function recordsFromCSV(csvText) {
            const rows = parseCSV(csvText.replace(/^\uFEFF/, ''));
            if (rows.length < 2) throw new Error('CSVにデータ行がありません');
            const headers = rows[0].map(x => x.trim());
            const recordIndex = headers.indexOf('record_json');
            if (recordIndex < 0) throw new Error('このアプリで出力したCSV形式ではありません（record_json列がありません）');
            const unique = new Map();
            rows.slice(1).forEach(row => {
                const raw = row[recordIndex];
                if (!raw) return;
                const record = JSON.parse(raw);
                if (!record.key || !record.date || !Array.isArray(record.cart)) throw new Error('CSV内のレース記録が不正です');
                unique.set(record.key, record);
            });
            if (!unique.size) throw new Error('読み込めるレース記録がありません');
            return Array.from(unique.values());
        }

        function recordsFromLegacyJSON(data) {
            if (data && data.format === 'keiba-history-v2' && Array.isArray(data.records)) return data.records;
            if (data && Array.isArray(data.cart)) {
                const tempState = { ...data, raceResults: data.raceResults || {} };
                if (!Object.keys(tempState.raceResults).length && data.results && data.currentDate) {
                    const legacyKey = raceKey(data.currentDate, data.racePlace || '', data.raceNumber || 1);
                    tempState.raceResults[legacyKey] = data.results;
                }
                const grouped = new Map();
                tempState.cart.forEach(item => {
                    const key = raceKey(item.date, item.place, item.rNum);
                    if (!grouped.has(key)) grouped.set(key, { key, date: item.date, place: item.place, rNum: item.rNum, horseCount: Number(state.raceHorseCounts?.[key]) || Number(item.horseCount) || null, cart: [], results: null });
                    if (!grouped.get(key).horseCount && Number(item.horseCount)) grouped.get(key).horseCount = Number(item.horseCount);
                    grouped.get(key).cart.push(item);
                });
                Object.entries(tempState.raceResults).forEach(([key, results]) => {
                    const [date, place, rNum] = key.split('|');
                    if (!grouped.has(key)) grouped.set(key, { key, date, place, rNum: Number(rNum), horseCount: Number(tempState.horseCount) || null, cart: [], results });
                    else grouped.get(key).results = results;
                });
                if (!grouped.size) throw new Error('買い目・収支データがありません');
                return Array.from(grouped.values());
            }
            throw new Error('対応していないJSON形式です');
        }

        function handleImportFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const content = String(e.target.result || '').replace(/^\uFEFF/, '');
                    let importedRecords;
                    if (/\.csv$/i.test(file.name) || !/^\s*[\[{]/.test(content)) {
                        importedRecords = recordsFromCSV(content);
                    } else {
                        importedRecords = recordsFromLegacyJSON(JSON.parse(content));
                    }
                    if (!confirm('インポートした記録を既存の履歴に統合します。同じレースは読み込んだデータで更新します。よろしいですか？')) return;

                    for (const incoming of importedRecords) {
                        if (!incoming.key || !incoming.date || !Array.isArray(incoming.cart)) throw new Error('レース記録の形式が不正です');
                        const existing = HISTORY_RECORDS.find(r => r.key === incoming.key);
                        const record = { ...incoming, cart: incoming.cart || [] };
                        if (!Number(record.horseCount)) record.horseCount = Number(record.cart.find(x => Number(x.horseCount))?.horseCount) || null;
                        if (existing && !record.results) record.results = existing.results || null;
                        const financials = buildRaceFinancials(record);
                        record.bets = financials.bets;
                        record.totalPurchase = financials.totalPurchase;
                        record.totalPayout = financials.totalPayout;
                        record.balance = financials.balance;
                        await putHistoryRecord(record);
                    }
                    HISTORY_RECORDS = await getAllHistoryRecords();
                    const currentKey = raceKey(APP_STATE.currentDate, document.getElementById('race-place').value || APP_STATE.racePlace, APP_STATE.raceNumber);
                    const currentRecord = HISTORY_RECORDS.find(r => r.key === currentKey);
                    if (currentRecord) {
                        APP_STATE.cart = APP_STATE.cart.filter(x => raceKey(x.date, x.place, x.rNum) !== currentKey).concat(currentRecord.cart || []);
                        if (currentRecord.results) {
                            APP_STATE.results = cloneData(currentRecord.results);
                            APP_STATE.raceResults = APP_STATE.raceResults || {};
                            APP_STATE.raceResults[currentKey] = cloneData(currentRecord.results);
                        }
                    }
                    saveToLocalStorage();
                    renderResultTable();
                    updateCartBadge();
                    await calculateSummary();
                    alert(`${importedRecords.length}レース分の記録を統合しました。`);
                } catch(err) {
                    console.error('インポートエラー:', err);
                    alert('インポートに失敗しました。ファイル形式または内容を確認してください。');
                } finally {
                    event.target.value = '';
                }
            };
            reader.onerror = () => { alert('ファイルの読み込みに失敗しました。'); event.target.value = ''; };
            reader.readAsText(file, 'UTF-8');
        }

        function isBlankResultValue(value) {
            if (value === null || value === undefined) return true;
            const text = String(value).trim();
            return text === '' || text.toLowerCase() === 'null';
        }

        function isZeroResultValue(value) {
            if (isBlankResultValue(value)) return true;
            const normalized = String(value).replace(/,/g, '').trim();
            return Number(normalized) === 0;
        }

        function hasResultPair(result, valueKey, payoutKey) {
            return !!result && !isBlankResultValue(result[valueKey]) &&
                !isBlankResultValue(result[payoutKey]) &&
                Number(String(result[payoutKey]).replace(/,/g, '')) >= 0;
        }

        function validateRaceResultRecord(record) {
            const errors = [];
            const results = record.results || {};
            const horseCount = Number(record.horseCount) ||
                Number(record.cart?.find(x => Number(x.horseCount))?.horseCount) || 0;
            const raceLabel = `${record.date || '日付不明'} ${record.place || '競馬場不明'} ${record.rNum || '?'}R`;

            if (!horseCount) {
                errors.push(`${raceLabel}：出走頭数が未登録です`);
                return errors;
            }

            // 単勝
            if (!hasResultPair(results.tansho, 'horse', 'payout')) {
                errors.push(`${raceLabel}：単勝の着順・払戻金が未入力です`);
            }

            // 複勝：通常は3頭。7頭以下の場合のみ3頭目を省略可能
            const fukusho = results.fukusho || {};
            const fukushoHorses = fukusho.horses || [];
            const fukushoPayouts = fukusho.payouts || [];
            const fukushoRequired = horseCount <= 7 ? 2 : 3;
            for (let i = 0; i < fukushoRequired; i++) {
                if (isBlankResultValue(fukushoHorses[i]) || isBlankResultValue(fukushoPayouts[i])) {
                    errors.push(`${raceLabel}：複勝${i + 1}頭目の馬番・払戻金が未入力です`);
                }
            }
            if (horseCount <= 7) {
                const thirdHorse = fukushoHorses[2];
                const thirdPayout = fukushoPayouts[2];
                const thirdIsEmptyOrZero = isBlankResultValue(thirdHorse) || String(thirdHorse).trim() === '0';
                const thirdPayoutIsEmptyOrZero = isZeroResultValue(thirdPayout);
                if (!(thirdIsEmptyOrZero && thirdPayoutIsEmptyOrZero) &&
                    (isBlankResultValue(thirdHorse) || isBlankResultValue(thirdPayout))) {
                    errors.push(`${raceLabel}：複勝3頭目は省略する場合、馬番・払戻金を空欄または0にしてください`);
                }
            }

            // 枠連：8頭以下は発売対象外のため、0-0／払戻金0または空欄を許容
            const wakuren = results.wakuren || {};
            if (horseCount <= 8) {
                const combo = wakuren.combo;
                const payout = wakuren.payout;
                const comboIsEmptyOrZero = isBlankResultValue(combo) || String(combo).trim() === '0-0' || String(combo).trim() === '0';
                const payoutIsEmptyOrZero = isZeroResultValue(payout);
                if (!(comboIsEmptyOrZero && payoutIsEmptyOrZero) &&
                    (isBlankResultValue(combo) || isBlankResultValue(payout))) {
                    errors.push(`${raceLabel}：8頭以下の枠連は省略する場合、組み合わせを0-0、払戻金を0または空欄にしてください`);
                }
            } else if (!hasResultPair(wakuren, 'combo', 'payout')) {
                errors.push(`${raceLabel}：枠連の組み合わせ・払戻金が未入力です`);
            }

            // その他の券種
            const pairTickets = [
                ['umaren', '馬連'], ['umatan', '馬単'],
                ['sanrenfuku', '三連複'], ['sanrentan', '三連単']
            ];
            pairTickets.forEach(([key, label]) => {
                const result = results[key] || {};
                const value = result.combo ?? result.horse;
                if (isBlankResultValue(value) || isBlankResultValue(result.payout)) {
                    errors.push(`${raceLabel}：${label}の組み合わせ・払戻金が未入力です`);
                }
            });

            // ワイドは最大3組の的中組み合わせと払戻金を確認
            const wide = results.wide || {};
            for (let i = 0; i < 3; i++) {
                if (isBlankResultValue(wide.combos?.[i]) || isBlankResultValue(wide.payouts?.[i])) {
                    errors.push(`${raceLabel}：ワイド${i + 1}組目の組み合わせ・払戻金が未入力です`);
                }
            }

            return errors;
        }

        function findIncompleteRaceResults(records) {
            const errors = [];
            (records || []).forEach(record => {
                const hasBets = (record.cart || []).some(group => (group.combos || []).length > 0) ||
                    (record.bets || []).length > 0;
                if (hasBets) errors.push(...validateRaceResultRecord(record));
            });
            return errors;
        }

        async function exportData(format = 'json') {
            try {
                await archiveState(APP_STATE);
                const records = await getAllHistoryRecords();
                const incompleteResults = findIncompleteRaceResults(records);
                if (incompleteResults.length > 0) {
                    const displayErrors = incompleteResults.slice(0, 15);
                    const remaining = incompleteResults.length - displayErrors.length;
                    alert(
                        'エクスポートできません。以下のレースで結果が未入力、または不完全です。\n\n' +
                        displayErrors.join('\n') +
                        (remaining > 0 ? `\nほか${remaining}件あります。` : '') +
                        '\n\n結果と払戻金を入力してから、再度エクスポートしてください。'
                    );
                    return;
                }
                let blob, filename;
                if (format === 'csv') {
                    // 1行=1買い目の組み合わせ。record_json列に完全なレースデータを保持するため再インポート時も情報を失わない。
                    const headers = ['日付', '競馬場', 'R番号', '出走頭数', '券種', '買い目', '購入金額(円)', 'レース購入合計(円)', '払戻合計(円)', '収支(円)', 'record_json'];
                    const lines = [headers.map(csvEscape).join(',')];
                    const ticketNames = { tansho: '単勝', fukusho: '複勝', wakuren: '枠連', umaren: '馬連', wide: 'ワイド', umatan: '馬単', sanrenfuku: '三連複', sanrentan: '三連単' };
                    records.forEach(record => {
                        const recordJSON = JSON.stringify(record);
                        let wrote = false;
                        (record.cart || []).forEach(group => {
                            (group.combos || []).forEach((combo, idx) => {
                                wrote = true;
                                const units = Math.max(1, Number(group.items?.[idx]?.amount) || 1);
                                const amount = units * 100;
                                const values = [record.date, record.place, record.rNum, record.horseCount || group.horseCount || '', ticketNames[group.ticket] || group.ticket, Array.isArray(combo) ? combo.join('-') : combo, amount, record.totalPurchase ?? buildRaceFinancials(record).totalPurchase, record.totalPayout ?? buildRaceFinancials(record).totalPayout, record.balance ?? buildRaceFinancials(record).balance, recordJSON];
                                lines.push(values.map(csvEscape).join(','));
                            });
                        });
                        if (!wrote) {
                            const financials = buildRaceFinancials(record);
                            lines.push([record.date, record.place, record.rNum, record.horseCount || '', '', '', '', financials.totalPurchase, financials.totalPayout, financials.balance, recordJSON].map(csvEscape).join(','));
                        }
                    });
                    blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
                    filename = `kaime_history_${APP_STATE.currentDate}.csv`;
                } else {
                    const payload = { format: 'keiba-history-v2', exportedAt: new Date().toISOString(), records };
                    blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
                    filename = `kaime_history_${APP_STATE.currentDate}.json`;
                }
                const url = URL.createObjectURL(blob);
                const downloadAnchor = document.createElement('a');
                downloadAnchor.href = url;
                downloadAnchor.download = filename;
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
                URL.revokeObjectURL(url);
            } catch (err) {
                console.error('エクスポートエラー:', err);
                alert('履歴のエクスポートに失敗しました。');
            }
        }

    </script>
