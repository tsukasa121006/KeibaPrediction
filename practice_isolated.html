<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予想練習</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] { -moz-appearance: textfield; }

        /* 8枠カラー定義 (8枠指定色: #DC6179) */
        .frame-1-bg { background-color: #ffffff !important; color: #000000 !important; border: 1px solid #d1d5db; }
        .frame-2-bg { background-color: #262626 !important; color: #ffffff !important; }
        .frame-3-bg { background-color: #d62828 !important; color: #ffffff !important; }
        .frame-4-bg { background-color: #2563eb !important; color: #ffffff !important; }
        .frame-5-bg { background-color: #eab308 !important; color: #ffffff !important; }
        .frame-6-bg { background-color: #16a34a !important; color: #ffffff !important; }
        .frame-7-bg { background-color: #ea580c !important; color: #ffffff !important; }
        .frame-8-bg { background-color: #DC6179 !important; color: #ffffff !important; }

        /* 券種専用カラー */
        .ticket-tansho { background-color: #4c54a4 !important; color: #ffffff !important; }
        .ticket-fukusho { background-color: #c04445 !important; color: #ffffff !important; }
        .ticket-wakuren { background-color: #419b48 !important; color: #ffffff !important; }
        .ticket-umaren { background-color: #835391 !important; color: #ffffff !important; }
        .ticket-wide { background-color: #368b98 !important; color: #ffffff !important; }
        .ticket-umatan { background-color: #e39229 !important; color: #ffffff !important; }
        .ticket-sanrenfuku { background-color: #3883b5 !important; color: #ffffff !important; }
        .ticket-sanrentan { background-color: #e36738 !important; color: #ffffff !important; }

        /* 馬1・馬2・馬3 矢印バッジスタイル */
        .horse-badge-arrow {
            background-color: #4b5563;
            color: #ffffff;
            font-weight: bold;
            font-size: 11px;
            padding: 2px 14px 2px 8px;
            clip-path: polygon(0% 0%, 85% 0%, 100% 50%, 85% 100%, 0% 100%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 48px;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-12">
<main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- 左側エリア -->
        <div class="lg:col-span-2 space-y-4">
            
            <h1 class="text-xl font-bold text-sky-700">買い目シミュレーション</h1>
            
            <!-- レース条件・R番号・頭数・カートボタン -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-wrap items-center justify-between gap-3">
                <div class="flex items-center gap-2">
                    <div>
                        <label class="block text-[11px] font-bold text-gray-500 mb-1">レース場</label>
                        <select id="race-place" onchange="onRaceConditionChange()" class="border border-gray-300 rounded-lg px-2.5 py-1.5 text-xs font-medium focus:ring-2 focus:ring-sky-500 focus:outline-none bg-white">
                            <option value="">--</option>
                            <option value="東京">東京</option>
                            <option value="中山">中山</option>
                            <option value="阪神">阪神</option>
                            <option value="京都">京都</option>
                            <option value="中京">中京</option>
                            <option value="札幌">札幌</option>
                            <option value="函館">函館</option>
                            <option value="福島">福島</option>
                            <option value="新潟">新潟</option>
                            <option value="小倉">小倉</option>
                        </select>
                    </div>
                </div>

                <!-- R番号 -->
                <div class="flex-1 min-w-[200px]">
                    <label class="block text-[11px] font-bold text-gray-500 mb-1">R番号</label>
                    <div id="r-grid" class="grid grid-cols-6 gap-1"></div>
                </div>

                <!-- 頭数 -->
                <div>
                    <label class="block text-[11px] font-bold text-gray-500 mb-1">頭数</label>
                    <select id="horse-count" onchange="onHorseCountChange()" class="border border-gray-300 rounded-lg px-2.5 py-1.5 text-xs font-medium focus:ring-2 focus:ring-sky-500 focus:outline-none bg-white"></select>
                </div>

                <!-- 買い目一覧ボタン -->
                <div class="flex items-end ml-auto">
                    <button type="button" onclick="openCartModal()" class="bg-orange-500 hover:bg-orange-600 text-white font-bold px-3.5 py-2 rounded-xl shadow-md flex items-center gap-2 transition active:scale-95 text-xs">
                        <i class="fa-solid fa-cart-shopping"></i> 買い目一覧 <span id="cart-badge" class="bg-white text-orange-600 px-2 py-0.5 rounded-full text-xs font-black">0点</span>
                    </button>
                </div>
            </div>

            <!-- 券種選択タブ -->
            <div class="flex flex-wrap gap-2 border-b border-gray-200 pb-2">
                <button type="button" onclick="switchTicket('tansho_fukusho')" id="btn-ticket-tansho_fukusho" class="px-4 py-2 rounded-lg font-bold text-sm border transition shadow-sm ticket-tansho">単勝・複勝</button>
                <button type="button" onclick="switchTicket('wakuren')" id="btn-ticket-wakuren" class="px-4 py-2 rounded-lg font-bold text-sm border transition shadow-sm bg-white text-gray-700 border-gray-300 hover:bg-gray-50">枠連</button>
                <button type="button" onclick="switchTicket('umaren')" id="btn-ticket-umaren" class="px-4 py-2 rounded-lg font-bold text-sm border transition shadow-sm bg-white text-gray-700 border-gray-300 hover:bg-gray-50">馬連</button>
                <button type="button" onclick="switchTicket('wide')" id="btn-ticket-wide" class="px-4 py-2 rounded-lg font-bold text-sm border transition shadow-sm bg-white text-gray-700 border-gray-300 hover:bg-gray-50">ワイド</button>
                <button type="button" onclick="switchTicket('umatan')" id="btn-ticket-umatan" class="px-4 py-2 rounded-lg font-bold text-sm border transition shadow-sm bg-white text-gray-700 border-gray-300 hover:bg-gray-50">馬単</button>
                <button type="button" onclick="switchTicket('sanrenfuku')" id="btn-ticket-sanrenfuku" class="px-4 py-2 rounded-lg font-bold text-sm border transition shadow-sm bg-white text-gray-700 border-gray-300 hover:bg-gray-50">3連複</button>
                <button type="button" onclick="switchTicket('sanrentan')" id="btn-ticket-sanrentan" class="px-4 py-2 rounded-lg font-bold text-sm border transition shadow-sm bg-white text-gray-700 border-gray-300 hover:bg-gray-50">3連単</button>
            </div>

            <!-- サブ方式タブ -->
            <div class="flex items-center justify-between bg-white px-4 py-2.5 rounded-xl border border-gray-200 shadow-sm">
                <div id="sub-mode-buttons" class="flex gap-2"></div>
                <div id="extra-options" class="flex items-center gap-3"></div>
            </div>

            <!-- 3連単・馬単 ながし指定サブナビ -->
            <div id="nagashi-subnav-container" class="hidden bg-gray-50 px-4 py-2 rounded-xl border border-gray-200 flex items-center gap-2">
                <span class="text-xs font-bold text-gray-500 mr-2">軸指定:</span>
                <div id="nagashi-subnav-buttons" class="flex flex-wrap gap-1.5"></div>
            </div>

            <!-- 馬選択テーブル & 買い目プレビュー（2カラム） -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                
                <!-- 馬選択テーブル -->
                <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-200">
                    <div class="overflow-x-auto">
                        <table class="w-full text-xs text-center border-collapse">
                            <thead id="horse-table-head" class="bg-gray-100 text-gray-600 border-b border-gray-200"></thead>
                            <tbody id="horse-table-body" class="divide-y divide-gray-200"></tbody>
                            <tfoot id="horse-table-foot" class="border-t border-gray-200 bg-gray-50"></tfoot>
                        </table>
                    </div>
                </div>

                <!-- 買い目構築プレビューエリア（スクロール完全解除） -->
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col justify-between space-y-4">
                    <div>
                        <div class="flex items-center justify-between border-b border-gray-200 pb-2 mb-3">
                            <h3 class="font-bold text-sm text-gray-800">買い目</h3>
                            <button type="button" onclick="addCurrentToCart()" class="border border-orange-500 text-orange-600 hover:bg-orange-50 font-bold px-3 py-1 rounded-lg text-xs shadow-sm transition active:scale-95 flex items-center gap-1">
                                + 買い目追加
                            </button>
                        </div>

                        <!-- 券種タイトルバー -->
                        <div id="preview-ticket-header" class="ticket-tansho px-3 py-1.5 rounded-t-lg font-bold text-xs text-white mb-2">
                            単勝
                        </div>

                        <!-- 上部：概要表示エリア -->
                        <div id="preview-parent-badges" class="space-y-1 mb-2"></div>

                        <!-- 展開ボタン -->
                        <div id="expansion-container" class="hidden border-t border-b border-gray-100 py-1.5 my-2">
                            <button type="button" id="expansion-btn" onclick="toggleExpansion()" class="w-full py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-lg text-xs transition flex items-center justify-center gap-1">
                                展開する <i id="expansion-icon" class="fa-solid fa-chevron-down"></i>
                            </button>
                        </div>

                        <!-- 下部：展開表示エリア（自動縦伸び） -->
                        <div id="preview-combinations-badges" class="hidden space-y-1.5 mb-3 pt-1"></div>
                    </div>

                    <!-- 下部：金額設定 & 合計計算 -->
                    <div class="border-t border-gray-200 pt-3 space-y-3">
                        <div id="global-unit-amount-container" class="hidden" style="display:none">
                            <span class="text-xs font-bold text-gray-600">各</span>
                            <div class="flex items-center gap-1">
                                <button type="button" onclick="adjustUnitAmount(-1)" class="w-7 h-7 bg-white hover:bg-gray-100 text-gray-700 font-bold rounded border border-gray-300 text-xs flex items-center justify-center shadow-sm">-</button>
                                <div class="flex items-center border border-gray-300 rounded px-2 py-1 bg-white shadow-sm">
                                    <input type="number" id="input-unit-amount" value="1" min="1" step="1" onchange="setUnitAmount(this.value)" class="w-12 text-right text-xs font-bold focus:outline-none">
                                    <span class="text-xs text-gray-700 font-bold ml-1">00円</span>
                                </div>
                                <button type="button" onclick="adjustUnitAmount(1)" class="w-7 h-7 bg-white hover:bg-gray-100 text-gray-700 font-bold rounded border border-gray-300 text-xs flex items-center justify-center shadow-sm">+</button>
                            </div>
                        </div>

                        <div class="flex items-center justify-end px-1 text-right">
                            <div class="text-right">
                                <span id="preview-summary-text" class="text-xs font-bold text-gray-800">0点 計 0円</span>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- 右側：収支・結果エリア -->
        <div class="space-y-6">
            
            <!-- 日付フィルター & 収支合計カード -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 space-y-4">
                <div class="flex items-center justify-between gap-2">
                    <select id="date-filter-type" onchange="saveConditionState()" class="border border-gray-300 rounded-lg px-2 py-1 text-xs font-bold text-gray-700 bg-white">
                        <option value="日別">日別</option>
                        <option value="月別">月別</option>
                        <option value="年別">年別</option>
                    </select>
                    <div class="flex items-center gap-2">
                        <button type="button" onclick="shiftDate(-1)" class="w-7 h-7 bg-gray-100 hover:bg-gray-200 rounded-lg text-gray-600 flex items-center justify-center"><i class="fa-solid fa-chevron-left text-xs"></i></button>
                        <span id="current-display-date" class="font-bold text-sm text-gray-800"></span>
                        <button type="button" onclick="shiftDate(1)" class="w-7 h-7 bg-gray-100 hover:bg-gray-200 rounded-lg text-gray-600 flex items-center justify-center"><i class="fa-solid fa-chevron-right text-xs"></i></button>
                    </div>
                </div>

                <div class="text-center py-2 bg-gray-50 rounded-xl border border-gray-100">
                    <div class="text-xs font-bold text-gray-500 mb-0.5">収支合計</div>
                    <div id="balance-total-display" class="text-2xl font-black text-gray-800">0 円</div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-gray-50 p-2.5 rounded-lg text-center border border-gray-100">
                        <div class="text-[11px] font-bold text-gray-500">購入</div>
                        <div id="summary-purchase-display" class="text-sm font-black text-gray-800">0円</div>
                    </div>
                    <div class="bg-gray-50 p-2.5 rounded-lg text-center border border-gray-100">
                        <div class="text-[11px] font-bold text-gray-500">払戻</div>
                        <div id="summary-payout-display" class="text-sm font-black text-gray-800">0円</div>
                    </div>
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="triggerImport()" class="flex-1 bg-sky-600 hover:bg-sky-700 text-white font-bold py-2 rounded-xl text-xs shadow transition">インポート</button>
                    <button type="button" onclick="openExportModal()" class="flex-1 bg-sky-600 hover:bg-sky-700 text-white font-bold py-2 rounded-xl text-xs shadow transition">エクスポート</button>
                    <button type="button" onclick="openHistoryEditor()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-xl text-xs shadow transition">記録編集</button>
                </div>
            </div>

            <!-- 結果入力エリア -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 space-y-3">
                <div class="flex items-center justify-between border-b border-gray-200 pb-2">
                    <h3 class="font-bold text-sm text-sky-700">結果</h3>
                    <button type="button" onclick="clearCurrentRaceResults()" class="px-3 py-1 border border-red-400 text-red-600 hover:bg-red-50 rounded-lg text-xs font-bold transition">クリア</button>
                </div>
                
                <div class="overflow-hidden rounded-xl border border-gray-200 shadow-sm">
                    <table class="w-full text-xs text-center border-collapse">
                        <thead>
                            <tr class="bg-gray-100 text-gray-700 font-bold border-b border-gray-200">
                                <th class="py-2 px-2 w-16 border-r border-gray-200">式別</th>
                                <th class="py-2 px-2 w-24 border-r border-gray-200">馬番/枠番</th>
                                <th class="py-2 px-2">払戻金 (円)</th>
                            </tr>
                        </thead>
                        <tbody id="result-table-body" class="divide-y divide-gray-200 bg-white"></tbody>
                    </table>
                </div>

                <div class="space-y-1.5 pt-2">
                    <label class="block text-xs font-bold text-gray-600">結果自動入力</label>
                    <textarea id="ai-result-textarea" rows="6" placeholder="オッズ・払戻テキストをそのまま貼り付けてください..." class="w-full border border-gray-300 rounded-lg p-2 text-xs focus:ring-2 focus:ring-sky-500 focus:outline-none font-mono"></textarea>
                    <button type="button" onclick="parseAiResultText()" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-2 rounded-lg text-xs shadow transition">自動入力</button>
                </div>
            </div>

        </div>

    </main>

    <!-- 買い目展開確認 モーダル -->
    <div id="confirm-modal" class="fixed inset-0 bg-black/70 z-[999] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 text-center space-y-4">
            <h4 class="font-bold text-base text-gray-800">買い目が展開されますが、よろしいですか？</h4>
            <div class="flex gap-3 pt-2">
                <button type="button" onclick="confirmExpansionOK()" class="flex-1 bg-sky-600 hover:bg-sky-700 text-white font-bold py-2 rounded-xl text-sm shadow">OK</button>
                <button type="button" onclick="confirmExpansionCancel()" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2 rounded-xl text-sm">キャンセル</button>
            </div>
        </div>
    </div>

    <!-- 買い目一覧 モーダル -->
    <div id="cart-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[85vh] flex flex-col overflow-hidden">
            <div class="flex items-center justify-between gap-2 px-4 sm:px-6 py-3 border-b border-gray-200 bg-gray-50 shrink-0">
                <h3 class="font-bold text-base text-gray-800 shrink-0">買い目一覧</h3>
                <div class="flex items-center justify-end gap-1.5 min-w-0 ml-auto">
                    <button type="button" onclick="openBatchMode('amount')" class="px-2 py-1.5 border border-sky-600 text-sky-600 hover:bg-sky-50 font-bold rounded-lg text-[10px] sm:text-xs shadow-sm transition whitespace-nowrap">金額一括入力</button>
                    <button type="button" onclick="openBatchMode('delete')" class="px-2 py-1.5 border border-red-500 text-red-500 hover:bg-red-50 font-bold rounded-lg text-[10px] sm:text-xs shadow-sm transition whitespace-nowrap">一括削除</button>
                    <button type="button" onclick="closeCartModal()" class="w-8 h-8 rounded-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold flex items-center justify-center shrink-0"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>

            <div id="cart-modal-items" class="p-4 space-y-4 bg-gray-50 flex-1 min-h-0 overflow-y-auto overscroll-contain"></div>

            <div class="px-6 py-4 border-t border-gray-200 bg-white flex items-center justify-between shrink-0">
                <div id="cart-modal-summary-count" class="font-bold text-sm text-gray-700">0組 0点</div>
                <div id="cart-modal-summary-cost" class="font-black text-xl text-red-600">合計 0円</div>
            </div>
        </div>
    </div>

    <!-- エクスポート形式選択モーダル -->
    <div id="export-modal" class="fixed inset-0 bg-black/50 z-[60] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-xs p-6 space-y-5">
            <div class="flex items-center justify-between">
                <h3 class="font-bold text-base text-gray-800">エクスポート</h3>
                <button type="button" onclick="closeExportModal()" class="w-8 h-8 rounded-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p class="text-sm text-gray-600 text-center">出力形式を選択してください。</p>
            <div class="flex gap-3">
                <button type="button" onclick="exportFromModal('json')" class="flex-1 bg-sky-600 hover:bg-sky-700 text-white font-bold py-2.5 rounded-xl text-sm">JSON</button>
                <button type="button" onclick="exportFromModal('csv')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-sm">CSV</button>
            </div>
        </div>
    </div>

    <!-- 過去の買い目記録編集モーダル -->
    <div id="history-editor-modal" class="fixed inset-0 bg-black/50 z-[60] hidden flex items-center justify-center p-3">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[92vh] flex flex-col overflow-hidden">
            <div class="flex items-center justify-between px-5 py-4 border-b border-gray-200 bg-gray-50">
                <div>
                    <h3 class="font-bold text-base text-gray-800">記録編集</h3>
                    <p class="text-[11px] text-gray-500 mt-0.5">日付・レース場を選択して買い目を編集できます</p>
                </div>
                <button type="button" onclick="closeHistoryEditor()" class="w-8 h-8 rounded-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="grid grid-cols-2 gap-3 px-5 py-3 border-b border-gray-100 bg-white">
                <label class="text-xs font-bold text-gray-600">日付
                    <select id="history-editor-date" onchange="populateHistoryEditorPlaces()" class="mt-1 w-full border border-gray-300 rounded-lg p-2 text-sm bg-white"></select>
                </label>
                <label class="text-xs font-bold text-gray-600">レース場
                    <select id="history-editor-place" onchange="renderHistoryEditor()" class="mt-1 w-full border border-gray-300 rounded-lg p-2 text-sm bg-white"></select>
                </label>
            </div>
            <div id="history-editor-items" class="p-4 overflow-y-auto flex-1 space-y-4 bg-gray-50"></div>
            <div class="px-5 py-3 border-t border-gray-200 bg-white flex items-center justify-between">
                <div id="history-editor-summary" class="font-black text-sm text-gray-800">合計 0円</div>
                <button type="button" onclick="closeHistoryEditor()" class="px-5 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold rounded-lg text-xs">閉じる</button>
            </div>
        </div>
    </div>

    <!-- 一括操作サブモーダル -->
    <div id="batch-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md max-h-[80vh] flex flex-col overflow-hidden">
            <div class="flex items-center justify-between px-5 py-3 border-b border-gray-200 bg-gray-50">
                <h4 id="batch-modal-title" class="font-bold text-sm text-gray-800">一括操作</h4>
                <button type="button" onclick="closeBatchModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="flex items-center justify-between px-5 py-2.5 border-b border-gray-100 bg-white text-xs">
                <span class="font-bold text-gray-600">全選択・全解除</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="batch-toggle-all" checked onchange="toggleBatchAll(this.checked)" class="sr-only peer">
                    <div class="w-9 h-5 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-sky-600"></div>
                </label>
            </div>

    <script>
        // 8枠カラー定義 (8枠指定色: #DC6179)
        const FRAME_COLORS = [
            { bg: "frame-1-bg" },
            { bg: "frame-2-bg" },
            { bg: "frame-3-bg" },
            { bg: "frame-4-bg" },
            { bg: "frame-5-bg" },

            { bg: "frame-8-bg" }
        ];

        // 券種カラーマスター
        const TICKET_COLORS = {
            tansho: { bg: "ticket-tansho", text: "単勝" },
            fukusho: { bg: "ticket-fukusho", text: "複勝" },
            wakuren: { bg: "ticket-wakuren", text: "枠連" },
            umaren: { bg: "ticket-umaren", text: "馬連" },
            wide: { bg: "ticket-wide", text: "ワイド" },
            umatan: { bg: "ticket-umatan", text: "馬単" },
            sanrenfuku: { bg: "ticket-sanrenfuku", text: "3連複" },
            sanrentan: { bg: "ticket-sanrentan", text: "3連単" }
        };

        // アプリケーション状態
        let APP_STATE = {
            currentDate: new Date().toISOString().split('T')[0],
            dateFilterType: "日別",
            racePlace: "",
            raceNumber: 1,
            horseCount: 18,
            raceHorseCounts: {},

            singleType: "tansho",

            isMulti: false,

                singleSelected: [],
                boxSelected: [],
                axis: null,

                opponents: [],
                pos1: [],
                pos2: [],
                pos3: []
            },
            singleCustomAmounts: {},
            unitAmounts: {}, 
            isExpanded: false,
            isFullyDecomposed: false,
            expandedItems: [],
            cart: [],
            raceResults: {},
            results: {
                tansho: { horse: "", payout: "" },
                fukusho: { horses: ["", "", ""], payouts: ["", "", ""] },
                wakuren: { combo: "", payout: "" },
                umaren: { combo: "", payout: "" },
                wide: { combos: ["", "", ""], payouts: ["", "", ""] },
                umatan: { combo: "", payout: "" },
                sanrenfuku: { combo: "", payout: "" },
                sanrentan: { combo: "", payout: "" }
            }
        };

        let currentBatchMode = null;
        let pendingIndividualAction = null;
        let pendingCartAction = null;

        /**
         * JRAの枠番割り当て
         */
        function getFrameNumber(horseNum, total) {
            const h = Number.parseInt(horseNum, 10);
            const t = Number.parseInt(total, 10);

            if (!Number.isInteger(h) || !Number.isInteger(t) ||
                h < 1 || h > t || t < 1 || t > 18) {
                return null;
            }

            const frameSizes = [];

            if (t <= 8) {
                for (let frame = 1; frame <= t; frame++) {
                    frameSizes.push(1);
                }
            } else if (t <= 15) {
                const oneHorseFrames = 16 - t;

                for (let frame = 1; frame <= 8; frame++) {
                    frameSizes.push(frame <= oneHorseFrames ? 1 : 2);
                }
            } else if (t === 16) {
                frameSizes.push(2, 2, 2, 2, 2, 2, 2, 2);
            } else if (t === 17) {
                frameSizes.push(2, 2, 2, 2, 2, 2, 2, 3);
            } else {
                frameSizes.push(2, 2, 2, 2, 2, 2, 3, 3);
            }

            let lastHorseNumber = 0;

            for (let frame = 0; frame < frameSizes.length; frame++) {
                lastHorseNumber += frameSizes[frame];

                if (h <= lastHorseNumber) {
                    return frame + 1;
                }
            }

            return null;
        }

        function getActiveFrames(total) {
            const count = parseInt(total);
            const maxFrame = count <= 8 ? count : 8;
            const frames = [];
            for(let f=1; f<=maxFrame; f++) frames.push(f);
            return frames;
        }

        let HISTORY_RECORDS = [];
        const HISTORY_DB_NAME = 'keiba_bet_history_db';
        const HISTORY_DB_VERSION = 1;

        function openHistoryDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(HISTORY_DB_NAME, HISTORY_DB_VERSION);
                request.onupgradeneeded = () => {
                    const db = request.result;
                    if (!db.objectStoreNames.contains('races')) db.createObjectStore('races', { keyPath: 'key' });
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        function raceKey(date, place, rNum) {
            return `${date}|${place}|${rNum}`;
        }

        function cloneData(value) {
            return JSON.parse(JSON.stringify(value));
        }

        async function getAllHistoryRecords() {
            const db = await openHistoryDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction('races', 'readonly');
                const req = tx.objectStore('races').getAll();
                req.onsuccess = () => { db.close(); resolve(req.result || []); };
                req.onerror = () => { db.close(); reject(req.error); };
            });
        }

        async function putHistoryRecord(record) {
            const db = await openHistoryDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction('races', 'readwrite');
                tx.objectStore('races').put(record);
                tx.oncomplete = () => { db.close(); resolve(); };
                tx.onerror = () => { db.close(); reject(tx.error); };
            });
        }

        function getActiveRaceKey(date = APP_STATE.currentDate, place = APP_STATE.racePlace || document.getElementById('race-place')?.value || '', rNum = APP_STATE.raceNumber) {
            return raceKey(date, place, rNum);
        }

        function saveActiveHorseCount() {
            APP_STATE.raceHorseCounts = APP_STATE.raceHorseCounts || {};
            const place = APP_STATE.racePlace || document.getElementById('race-place')?.value || '';
            if (!place) return;
            APP_STATE.raceHorseCounts[getActiveRaceKey(APP_STATE.currentDate, place, APP_STATE.raceNumber)] = Number(APP_STATE.horseCount) || 18;
        }

        function loadActiveHorseCount() {
            APP_STATE.raceHorseCounts = APP_STATE.raceHorseCounts || {};
            const key = getActiveRaceKey();
            const historyRecord = HISTORY_RECORDS.find(r => r.key === key);
            // 買い目データに保存された頭数を最優先し、旧版で誤ったキーに保存された値を拾わないようにする
            const cartSaved = Number(APP_STATE.cart?.find(item => item.date === APP_STATE.currentDate && item.place === (APP_STATE.racePlace || document.getElementById('race-place')?.value || '') && Number(item.rNum) === Number(APP_STATE.raceNumber) && Number(item.horseCount))?.horseCount);
            const localSaved = Number(APP_STATE.raceHorseCounts[key]);
            const historySaved = Number(historyRecord?.horseCount) || Number(historyRecord?.cart?.find(x => Number(x.horseCount))?.horseCount);
            const candidates = [cartSaved, localSaved, historySaved];
            const saved = candidates.find(value => Number.isInteger(value) && value >= 5 && value <= 18) || 18;
            APP_STATE.horseCount = saved;
            const select = document.getElementById('horse-count');
            if (select) select.value = String(saved);
        }

        function getCurrentRaceResults() {
            const place = document.getElementById('race-place')?.value || APP_STATE.racePlace || '';
            const key = raceKey(APP_STATE.currentDate, place, APP_STATE.raceNumber);
            const saved = APP_STATE.raceResults?.[key] || HISTORY_RECORDS.find(r => r.key === key)?.results;
            return saved ? saved : { tansho: { horse: '', payout: '' }, fukusho: { horses: ['', '', ''], payouts: ['', '', ''] }, wakuren: { combo: '', payout: '' }, umaren: { combo: '', payout: '' }, wide: { combos: ['', '', ''], payouts: ['', '', ''] }, umatan: { combo: '', payout: '' }, sanrenfuku: { combo: '', payout: '' }, sanrentan: { combo: '', payout: '' } };
        }

        function setCurrentRaceResults(results) {
            const place = document.getElementById('race-place')?.value || APP_STATE.racePlace || '';
            const key = raceKey(APP_STATE.currentDate, place, APP_STATE.raceNumber);
            APP_STATE.raceResults = APP_STATE.raceResults || {};
            APP_STATE.raceResults[key] = cloneData(results);
            APP_STATE.results = cloneData(results);
        }

        // レース単位の保存データを生成。金額は円単位で保持する。
        function buildRaceFinancials(record) {
            const bets = [];
            (record.cart || []).forEach(group => {
                (group.combos || []).forEach((combo, idx) => {
                    const units = Math.max(1, Number(group.items?.[idx]?.amount) || 1);
                    bets.push({
                        groupId: group.id,
                        ticket: group.ticket,
                        combo: cloneData(combo),
                        amount: units * 100
                    });
                });
            });
            const totalPurchase = bets.reduce((sum, bet) => sum + bet.amount, 0);
            const totalPayout = calculateRacePayout(record);
            return { bets, totalPurchase, totalPayout, balance: totalPayout - totalPurchase };
        }

        async function archiveState(state) {
            if (!state || !Array.isArray(state.cart)) return;
            const grouped = new Map();
            state.cart.forEach(item => {
                const key = raceKey(item.date, item.place, item.rNum);
                if (!grouped.has(key)) grouped.set(key, { key, date: item.date, place: item.place, rNum: item.rNum, horseCount: Number(state.raceHorseCounts?.[key]) || Number(item.horseCount) || null, cart: [], results: null });
                if (!grouped.get(key).horseCount && Number(item.horseCount)) grouped.get(key).horseCount = Number(item.horseCount);
                grouped.get(key).cart.push(item);
            });
            const raceResults = state.raceResults || {};
            for (const [key, results] of Object.entries(raceResults)) {
                if (!grouped.has(key)) {
                    const [date, place, rNum] = key.split('|');
                    grouped.set(key, { key, date, place, rNum: Number(rNum), horseCount: Number(state.raceHorseCounts?.[key]) || Number(state.horseCount) || null, cart: [], results: cloneData(results) });
                } else grouped.get(key).results = cloneData(results);
            }
            const activePlace = state.racePlace || document.getElementById('race-place')?.value || '';
            const activeKey = raceKey(state.currentDate, activePlace, state.raceNumber);
            if (!grouped.has(activeKey)) grouped.set(activeKey, { key: activeKey, date: state.currentDate, place: activePlace, rNum: state.raceNumber, horseCount: Number(state.raceHorseCounts?.[activeKey]) || Number(state.horseCount) || null, cart: [], results: cloneData(state.results) });
            else {
                grouped.get(activeKey).results = cloneData(state.results);
                if (!grouped.get(activeKey).horseCount && Number(state.horseCount)) grouped.get(activeKey).horseCount = Number(state.horseCount);
            }

            for (const record of grouped.values()) {
                if (Number(state.raceHorseCounts?.[record.key])) record.horseCount = Number(state.raceHorseCounts[record.key]);
                const old = HISTORY_RECORDS.find(r => r.key === record.key);
                if (old) {
                    if (!Number(record.horseCount)) record.horseCount = Number(old.horseCount) || Number(old.cart?.find(x => Number(x.horseCount))?.horseCount) || null;
                    // localStorage側のcartは現在の作業状態そのもの。
                    // 削除済みグループをIndexedDBから復活させないよう、同一レースは置き換える。
                    record.cart = cloneData(record.cart || []);
                    if (!record.results) record.results = old.results || null;
                }
                if (!Number(record.horseCount)) {
                    record.horseCount = Number(record.cart?.find(x => Number(x.horseCount))?.horseCount) || null;
                }
                const financials = buildRaceFinancials(record);
                record.bets = financials.bets;
                record.totalPurchase = financials.totalPurchase;
                record.totalPayout = financials.totalPayout;
                record.balance = financials.balance;
                await putHistoryRecord(record);
            }
            HISTORY_RECORDS = await getAllHistoryRecords();
        }

        window.onload = async function () {
            await loadFromLocalStorage();
            initHorseCountDropdown();
            initRaceNumberGrid();
            renderSubModeButtons();
            renderHorseTable();
            renderResultTable();
            updateCartBadge();
            updateCombinationsMath();
            await calculateSummary();
        };

        async function loadFromLocalStorage() {
            const todayStr = new Date().toISOString().split('T')[0];
            const savedDate = localStorage.getItem('sim_last_date');
            const savedState = localStorage.getItem('sim_app_state');
            HISTORY_RECORDS = await getAllHistoryRecords().catch(() => []);

            // 0:00をまたいだ場合も、削除前に履歴DBへ退避してからlocalStorageを初期化
            if (savedDate !== todayStr) {
                if (savedState) {
                    try { await archiveState(JSON.parse(savedState)); }
                    catch (e) {
                        console.error('日次履歴の退避に失敗:', e);
                        alert('過去データを履歴DBに保存できなかったため、localStorageの自動削除を今回は中止しました。');
                        return;
                    }
                }
                localStorage.clear();
                localStorage.setItem('sim_last_date', todayStr);
            } else if (savedState) {
                try {
                    const parsed = JSON.parse(savedState);
                    APP_STATE = { ...APP_STATE, ...parsed, raceResults: parsed.raceResults || {}, raceHorseCounts: parsed.raceHorseCounts || {} };
                } catch(e) { console.error('保存データの読み込みに失敗:', e); }
            }

            HISTORY_RECORDS = await getAllHistoryRecords().catch(() => []);
            const place = document.getElementById('race-place');
            if (place) place.value = APP_STATE.racePlace;
            document.getElementById('date-filter-type').value = APP_STATE.dateFilterType;
            document.getElementById('current-display-date').innerText = formatDisplayDate(APP_STATE.currentDate, APP_STATE.dateFilterType);
            loadActiveHorseCount();
            saveActiveHorseCount();
            APP_STATE.results = cloneData(getCurrentRaceResults());
        }

        let archiveWriteQueue = Promise.resolve();

        function saveToLocalStorage() {
            const todayStr = new Date().toISOString().split('T')[0];
            localStorage.setItem('sim_last_date', todayStr);
            localStorage.setItem('sim_app_state', JSON.stringify(APP_STATE));
            // 操作が短時間に連続しても、古い非同期保存が新しい状態を上書きしないよう直列化する。
            const snapshot = cloneData(APP_STATE);
            archiveWriteQueue = archiveWriteQueue
                .catch(() => {})
                .then(() => archiveState(snapshot))
                .then(() => calculateSummary())
                .catch(err => console.error('履歴保存エラー:', err));
            return archiveWriteQueue;
        }

        function saveConditionState() {
            APP_STATE.racePlace = document.getElementById('race-place').value;
            APP_STATE.dateFilterType = document.getElementById('date-filter-type').value;
            document.getElementById('current-display-date').innerText = formatDisplayDate(APP_STATE.currentDate, APP_STATE.dateFilterType);
            saveToLocalStorage();
        }

        function onRaceConditionChange() {
            // 競馬場変更時はracePlace更新前のキーで保存済みの状態を維持し、新しいレースの頭数を読み込む
            resetCurrentSelectionToDefault();
            APP_STATE.racePlace = document.getElementById('race-place').value;
            loadActiveHorseCount();
            renderHorseTable();
            APP_STATE.results = cloneData(getCurrentRaceResults());
            renderResultTable();
            // 切替後の日付・レース場・R番号に対応する買い目点数へ更新
            updateCartBadge();
            saveConditionState();
        }

        function resetCurrentSelectionToDefault() {
            clearSelections();
            APP_STATE.currentTicket = "tansho_fukusho";
            APP_STATE.singleType = "tansho";
            APP_STATE.subMode = "formation";
            APP_STATE.isExpanded = false;
            APP_STATE.isFullyDecomposed = false;
            switchTicket('tansho_fukusho');
        }

        function formatDisplayDate(dateStr, type) {
            const d = new Date(dateStr);
            const y = d.getFullYear();
            const m = d.getMonth() + 1;
            const day = d.getDate();
            const days = ['日', '月', '火', '水', '木', '金', '土'];
            const w = days[d.getDay()];

            if (type === '月別') return `${y}年${m}月`;
            if (type === '年別') return `${y}年`;
            return `${y}年${String(m).padStart(2,'0')}月${String(day).padStart(2,'0')}日(${w})`;
        }

        function shiftDate(diff) {
            saveActiveHorseCount();
            const d = new Date(APP_STATE.currentDate);
            const type = APP_STATE.dateFilterType;
            if (type === '月別') d.setMonth(d.getMonth() + diff);
            else if (type === '年別') d.setFullYear(d.getFullYear() + diff);
            else d.setDate(d.getDate() + diff);

            APP_STATE.currentDate = d.toISOString().split('T')[0];
            loadActiveHorseCount();
            APP_STATE.results = cloneData(getCurrentRaceResults());
            document.getElementById('current-display-date').innerText = formatDisplayDate(APP_STATE.currentDate, type);
            renderResultTable();
            // 日付変更後のレース条件に対応する買い目点数へ更新
            updateCartBadge();
            saveToLocalStorage();
        }

        function initHorseCountDropdown() {
            const select = document.getElementById('horse-count');
            select.innerHTML = '';
            for (let i = 5; i <= 18; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `${i}頭`;
                if (i === APP_STATE.horseCount) opt.selected = true;
                select.appendChild(opt);
            }
        }

        function onHorseCountChange() {
            APP_STATE.horseCount = parseInt(document.getElementById('horse-count').value);
            saveActiveHorseCount();
            clearSelections();
            saveToLocalStorage();
            renderHorseTable();
        }

        function initRaceNumberGrid() {
            const grid = document.getElementById('r-grid');
            grid.innerHTML = '';
            for (let i = 1; i <= 12; i++) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `py-1.5 rounded-lg text-xs font-bold border transition ${APP_STATE.raceNumber === i ? 'bg-sky-600 text-white border-sky-600 shadow-sm' : 'bg-white text-gray-700 border-gray-300 hover:bg-gray-50'}`;
                btn.textContent = `${i}R`;
                btn.onclick = () => {
                    if (APP_STATE.raceNumber !== i) {
                        saveActiveHorseCount();
                        APP_STATE.raceNumber = i;
                        onRaceConditionChange();
                        initRaceNumberGrid();
                    }
                };
                grid.appendChild(btn);
            }
        }

        function switchTicket(ticketKey) {
            APP_STATE.currentTicket = ticketKey;
            APP_STATE.isMulti = false;
            APP_STATE.nagashiTarget = "1着";
            APP_STATE.isExpanded = false;
            APP_STATE.isFullyDecomposed = false;
            clearSelections();

            ['tansho_fukusho', 'wakuren', 'umaren', 'wide', 'umatan', 'sanrenfuku', 'sanrentan'].forEach(k => {
                const btn = document.getElementById(`btn-ticket-${k}`);
                const colorKey = k === 'tansho_fukusho' ? APP_STATE.singleType : k;
                const activeColorClass = TICKET_COLORS[colorKey]?.bg || 'bg-sky-600';
                
                if (k === ticketKey) {
                    btn.className = `px-4 py-2 rounded-lg font-bold text-sm border transition shadow-sm ${activeColorClass} text-white`;
                } else {
                    btn.className = "px-4 py-2 rounded-lg font-bold text-sm border transition shadow-sm bg-white text-gray-700 border-gray-300 hover:bg-gray-50";
                }
            });

            renderSubModeButtons();
            renderHorseTable();
            updateCombinationsMath();
        }

        function renderSubModeButtons() {
            const container = document.getElementById('sub-mode-buttons');
            const extra = document.getElementById('extra-options');
            const nagashiSubnav = document.getElementById('nagashi-subnav-container');
            container.innerHTML = '';
            extra.innerHTML = '';
            nagashiSubnav.classList.add('hidden');

            const ticket = APP_STATE.currentTicket;

            if (ticket === "tansho_fukusho") {
                container.innerHTML = `
                    <button type="button" onclick="switchSingleType('tansho')" class="px-3 py-1.5 rounded-md font-bold text-xs border ${APP_STATE.singleType === 'tansho' ? 'ticket-tansho' : 'bg-gray-100 text-gray-600 border-gray-300'}">単勝</button>
                    <button type="button" onclick="switchSingleType('fukusho')" class="px-3 py-1.5 rounded-md font-bold text-xs border ${APP_STATE.singleType === 'fukusho' ? 'ticket-fukusho' : 'bg-gray-100 text-gray-600 border-gray-300'}">複勝</button>
                `;
            } else if (ticket === "wakuren") {
                container.innerHTML = `
                    <button type="button" onclick="switchSubMode('formation')" class="px-3 py-1.5 rounded-md font-bold text-xs border ${APP_STATE.subMode === 'formation' ? 'bg-sky-600 text-white border-sky-600' : 'bg-gray-100 text-gray-600 border-gray-300'}">通常・フォーメーション</button>
                    <button type="button" onclick="switchSubMode('box')" class="px-3 py-1.5 rounded-md font-bold text-xs border ${APP_STATE.subMode === 'box' ? 'bg-sky-600 text-white border-sky-600' : 'bg-gray-100 text-gray-600 border-gray-300'}">ボックス</button>
                `;
            } else {
                container.innerHTML = `
                    <button type="button" onclick="switchSubMode('formation')" class="px-3 py-1.5 rounded-md font-bold text-xs border ${APP_STATE.subMode === 'formation' ? 'bg-sky-600 text-white border-sky-600' : 'bg-gray-100 text-gray-600 border-gray-300'}">通常・フォーメーション</button>
                    <button type="button" onclick="switchSubMode('box')" class="px-3 py-1.5 rounded-md font-bold text-xs border ${APP_STATE.subMode === 'box' ? 'bg-sky-600 text-white border-sky-600' : 'bg-gray-100 text-gray-600 border-gray-300'}">ボックス</button>
                    <button type="button" onclick="switchSubMode('nagashi')" class="px-3 py-1.5 rounded-md font-bold text-xs border ${APP_STATE.subMode === 'nagashi' ? 'bg-sky-600 text-white border-sky-600' : 'bg-gray-100 text-gray-600 border-gray-300'}">ながし</button>
                `;

                if ((ticket === "umatan" || ticket === "sanrentan") && APP_STATE.subMode !== 'box') {
                    extra.innerHTML = `
                        <label class="flex items-center gap-1.5 cursor-pointer text-xs font-bold text-gray-700">
                            <input type="checkbox" id="multi-checkbox" ${APP_STATE.isMulti ? 'checked' : ''} onchange="toggleMulti(this.checked)" class="w-4 h-4 text-sky-600 rounded"> マルチ
                        </label>
                    `;
                }

                if (APP_STATE.subMode === 'nagashi' && (ticket === "umatan" || ticket === "sanrentan")) {
                    nagashiSubnav.classList.remove('hidden');
                    renderSanrentanNagashiSubnav();
                }
            }
        }

        function switchSingleType(type) {
            APP_STATE.singleType = type;
            const btn = document.getElementById('btn-ticket-tansho_fukusho');
            if (btn) btn.className = `px-4 py-2 rounded-lg font-bold text-sm border transition shadow-sm ${TICKET_COLORS[type].bg}`;
            renderSubModeButtons();
            renderHorseTable();
            updateCombinationsMath();
        }

        function switchSubMode(mode) {
            APP_STATE.subMode = mode;
            APP_STATE.selection.axis2 = null;

            const createIconBtnPair = (targetType) => `
                <td class="py-1.5 px-1 align-middle border-r border-gray-200 text-center">
                    <div class="flex flex-col items-center justify-center">
                        <button type="button" onclick="toggleColumnAll('${targetType}', true)" class="w-6 h-5 rounded border border-gray-300 bg-white hover:bg-sky-50 text-sky-600 font-bold text-[11px] flex items-center justify-center shadow-sm">全</button>
                        <hr class="w-full border-t border-gray-300 my-0.5">
                        <button type="button" onclick="toggleColumnAll('${targetType}', false)" class="w-6 h-5 rounded border border-gray-300 bg-white hover:bg-gray-100 text-gray-500 font-bold text-[11px] flex items-center justify-center shadow-sm">消</button>

            if (ticket === "tansho_fukusho" || sub === "box") {
                footRow += createIconBtnPair('boxSingle');
            } else if (sub === "nagashi") {

                if (target === "1・2着" || target === "1・3着" || target === "2・3着") {
                    footRow += `<td class="py-1 px-1 text-gray-300 border-r border-gray-200 text-center">-</td><td class="py-1 px-1 text-gray-300 border-r border-gray-200 text-center">-</td>`;
                } else {

        function handleCellClick(event, type, val) {
            APP_STATE.isFullyDecomposed = false;
            const ticket = APP_STATE.currentTicket;

            if (type === 'boxSingle') {
                const arr = ticket === "tansho_fukusho" ? APP_STATE.selection.singleSelected : APP_STATE.selection.boxSelected;
                const idx = arr.indexOf(val);
                if (idx > -1) arr.splice(idx, 1);
                else arr.push(val);
                arr.sort((a,b)=>a-b);
            } else if (type === 'axis1') {
                APP_STATE.selection.axis = (APP_STATE.selection.axis === val) ? null : val;
            } else if (type === 'axis2') {
                APP_STATE.selection.axis2 = (APP_STATE.selection.axis2 === val) ? null : val;
            } else if (type === 'opponent') {
                const arr = APP_STATE.selection.opponents;
                const idx = arr.indexOf(val);
                if (idx > -1) arr.splice(idx, 1);
                else arr.push(val);
                arr.sort((a,b)=>a-b);
            } else {
                const arr = APP_STATE.selection[type];
                const idx = arr.indexOf(val);
                if (idx > -1) arr.splice(idx, 1);
                else arr.push(val);
                arr.sort((a,b)=>a-b);
            }

            renderHorseTable();
            updateCombinationsMath();
        }

        function toggleColumnAll(type, isSelect) {
            APP_STATE.isFullyDecomposed = false;
            const count = parseInt(APP_STATE.horseCount);
            let targetArr;

            if (APP_STATE.currentTicket === "wakuren") {
                const activeFrames = getActiveFrames(count);
                targetArr = APP_STATE.selection[type];
                targetArr.length = 0;
                if (isSelect) activeFrames.forEach(f => targetArr.push(f));
            } else {
                if (type === 'boxSingle') {
                    targetArr = (APP_STATE.currentTicket === "tansho_fukusho") ? APP_STATE.selection.singleSelected : APP_STATE.selection.boxSelected;
                } else if (type === 'opponent') {
                    targetArr = APP_STATE.selection.opponents;
                } else {
                    targetArr = APP_STATE.selection[type];
                }

                targetArr.length = 0;
                if (isSelect) {
                    for (let i = 1; i <= count; i++) targetArr.push(i);
                }
            }

            renderHorseTable();
            updateCombinationsMath();
        }

        function getStorageKeyForAmount() {
            let key = APP_STATE.currentTicket;
            if (key === "tansho_fukusho") key = APP_STATE.singleType;
            return `${key}_${APP_STATE.subMode}`;
        }

        function getCurrentUnitAmount() {
            const key = getStorageKeyForAmount();
            if (!APP_STATE.unitAmounts[key]) {
                APP_STATE.unitAmounts[key] = 1;
            }
            return APP_STATE.unitAmounts[key];
        }

        function setUnitAmount(val) {
            const num = Math.max(1, parseInt(val) || 1);
            const key = getStorageKeyForAmount();
            APP_STATE.unitAmounts[key] = num;
            
            const combos = calculateCombinations();
            APP_STATE.expandedItems = combos.map(c => ({ combo: c, amount: num }));

            updateCombinationsMath();
        }

        function adjustUnitAmount(diff) {
            let cur = getCurrentUnitAmount();
            cur = Math.max(1, cur + diff);
            setUnitAmount(cur);
        }

        function getUniquePermutations(values) {
            const result = [];
            const used = new Array(values.length).fill(false);
            const current = [];
            const walk = () => {
                if (current.length === values.length) {
                    result.push([...current]);
                    return;
                }
                for (let i = 0; i < values.length; i++) {
                    if (used[i]) continue;
                    used[i] = true;
                    current.push(values[i]);
                    walk();
                    current.pop();
                    used[i] = false;
                }
            };
            walk();
            return result;
        }

        function calculateCombinations() {
            const ticket = APP_STATE.currentTicket;
            const sub = APP_STATE.subMode;
            let combos = [];

            if (ticket === "wakuren") {
                const p1 = APP_STATE.selection.pos1;
                const p2 = APP_STATE.selection.pos2;
                if (sub === "box") {
                    const sel = [...APP_STATE.selection.boxSelected].sort((a,b)=>a-b);
                    for(let i=0; i<sel.length; i++){
                        for(let j=i; j<sel.length; j++){
                            combos.push([sel[i], sel[j]]);
                        }
                    }
                } else {
                    p1.forEach(f1 => {
                        p2.forEach(f2 => {
                            const pair = [f1, f2].sort((a,b)=>a-b);
                            if (!combos.some(c => c[0]===pair[0] && c[1]===pair[1])) {
                                combos.push(pair);
                            }
                        });
                    });
                }
                return combos;
            }

            if (ticket === "tansho_fukusho") {
                return [...APP_STATE.selection.singleSelected].sort((a,b)=>a-b).map(h => [h]);
            }

            if (sub === "box") {
                const sel = [...APP_STATE.selection.boxSelected].sort((a,b)=>a-b);
                if (ticket === "umaren" || ticket === "wide") {
                    for(let i=0; i<sel.length; i++){
                        for(let j=i+1; j<sel.length; j++){
                            combos.push([sel[i], sel[j]]);
                        }
                    }
                } else if (ticket === "umatan") {
                    for(let i=0; i<sel.length; i++){
                        for(let j=0; j<sel.length; j++){
                            if(i!==j) combos.push([sel[i], sel[j]]);
                        }
                    }
                } else if (ticket === "sanrenfuku") {
                    for(let i=0; i<sel.length; i++){
                        for(let j=i+1; j<sel.length; j++){
                            for(let k=j+1; k<sel.length; k++){
                                combos.push([sel[i], sel[j], sel[k]]);
                            }
                        }
                    }
                } else if (ticket === "sanrentan") {
                    for(let i=0; i<sel.length; i++){
                        for(let j=0; j<sel.length; j++){
                            for(let k=0; k<sel.length; k++){
                                if(i!==j && j!==k && i!==k) combos.push([sel[i], sel[j], sel[k]]);
                            }
                        }
                    }
                }
            } else if (sub === "nagashi") {
                const axis = APP_STATE.selection.axis;
                const axis2 = APP_STATE.selection.axis2;
                const opps = [...APP_STATE.selection.opponents].sort((a,b)=>a-b);

                if (!axis) return [];

                if (ticket === "umaren" || ticket === "wide") {
                    opps.forEach(o => {
                        if (axis !== o) {
                            const pair = [axis, o].sort((a,b)=>a-b);
                            combos.push(pair);
                        }
                    });
                } else if (ticket === "umatan") {
                    const target = APP_STATE.nagashiTarget;
                    opps.forEach(o => {
                        if (axis !== o) {
                            if (target === "2着") combos.push([o, axis]);
                            else combos.push([axis, o]);
                        }
                    });
                } else if (ticket === "sanrenfuku") {
                    for(let i=0; i<opps.length; i++){
                        for(let j=i+1; j<opps.length; j++){
                            if(opps[i]!==axis && opps[j]!==axis){
                                const trio = [axis, opps[i], opps[j]].sort((a,b)=>a-b);
                                combos.push(trio);
                            }
                        }
                    }
                } else if (ticket === "sanrentan") {
                    const target = APP_STATE.nagashiTarget;
                    if (target === "1・2着" || target === "1・3着" || target === "2・3着") {
                        if (!axis2 || axis === axis2) return [];
                        opps.forEach(o => {
                            if (o !== axis && o !== axis2) {
                                if (target === "1・2着") combos.push([axis, axis2, o]);
                                else if (target === "1・3着") combos.push([axis, o, axis2]);
                                else if (target === "2・3着") combos.push([o, axis, axis2]);
                            }
                        });
                    } else {
                        for(let i=0; i<opps.length; i++){
                            for(let j=0; j<opps.length; j++){
                                if(opps[i]!==opps[j] && opps[i]!==axis && opps[j]!==axis){
                                    if (target === "1着") combos.push([axis, opps[i], opps[j]]);
                                    else if (target === "2着") combos.push([opps[i], axis, opps[j]]);
                                    else if (target === "3着") combos.push([opps[i], opps[j], axis]);
                                }
                            }
                        }
                    }
                }
            } else {
                const p1 = [...APP_STATE.selection.pos1].sort((a,b)=>a-b);
                const p2 = [...APP_STATE.selection.pos2].sort((a,b)=>a-b);
                const p3 = [...APP_STATE.selection.pos3].sort((a,b)=>a-b);

                if (ticket === "umaren" || ticket === "wide") {
                    p1.forEach(h1 => {
                        p2.forEach(h2 => {
                            if (h1 !== h2) {
                                const pair = [h1, h2].sort((a,b)=>a-b);
                                if (!combos.some(c => c[0]===pair[0] && c[1]===pair[1])) {
                                    combos.push(pair);
                                }
                            }
                        });
                    });
                } else if (ticket === "umatan") {
                    p1.forEach(h1 => {
                        p2.forEach(h2 => {
                            if (h1 !== h2) combos.push([h1, h2]);
                        });
                    });
                } else if (ticket === "sanrenfuku") {
                    p1.forEach(h1 => {
                        p2.forEach(h2 => {
                            p3.forEach(h3 => {
                                if (h1!==h2 && h2!==h3 && h1!==h3) {
                                    const trio = [h1, h2, h3].sort((a,b)=>a-b);
                                    if (!combos.some(c => c[0]===trio[0] && c[1]===trio[1] && c[2]===trio[2])) {
                                        combos.push(trio);
                                    }
                                }
                            });
                        });
                    });
                } else if (ticket === "sanrentan") {
                    p1.forEach(h1 => {
                        p2.forEach(h2 => {
                            p3.forEach(h3 => {
                                if (h1!==h2 && h2!==h3 && h1!==h3) {
                                    combos.push([h1, h2, h3]);
                                }
                            });
                        });
                    });
                }
            }

            // マルチは馬単なら表裏、3連単なら同じ馬の全着順 permutations を購入対象にする。
            // ボックスやながしで既に同一組み合わせが生成されていても重複は除去する。
            if (APP_STATE.isMulti && (ticket === 'umatan' || ticket === 'sanrentan')) {
                const expanded = [];
                const seen = new Set();
                combos.forEach(combo => {
                    getUniquePermutations(combo).forEach(permutation => {
                        const key = permutation.join('-');
                        if (!seen.has(key)) {
                            seen.add(key);
                            expanded.push(permutation);
                        }
                    });
                });
                combos = expanded;
            }
            return combos;
        }

        function updateCombinationsMath() {
            const combos = calculateCombinations();
            const parentContainer = document.getElementById('preview-parent-badges');
            const badgeContainer = document.getElementById('preview-combinations-badges');
            const summaryText = document.getElementById('preview-summary-text');

                        <div class="flex items-center justify-between p-2 bg-white rounded-lg border border-gray-200 shadow-sm w-full my-1">

                                    <span class="text-xs text-gray-700 font-bold ml-0.5">00円</span>

                                <button type="button" onclick="changeSingleAmount(${h}, 1)" class="w-6 h-6 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded border border-gray-300 text-xs flex items-center justify-center">+</button>

                            </div>
                        </div>
                    `;
                }).join('');
            } else {
                if (APP_STATE.isFullyDecomposed) {
                    parentContainer.innerHTML = '';
                    expansionContainer.classList.add('hidden');
                    badgeContainer.classList.remove('hidden');
                    globalUnitContainer.classList.add('hidden');
                } else {

                    globalUnitContainer.classList.remove('hidden');

                    let parentHtml = '';
                    const renderPosBadges = (label, posArr) => {
                        const sortedArr = [...posArr].sort((a, b) => a - b);

                            const fNum = getFrameNumber(h, count);
                            const fStyle = FRAME_COLORS[fNum - 1] || FRAME_COLORS[0];
                            return `<span class="w-6 h-6 flex items-center justify-center rounded ${fStyle.bg} font-bold text-xs shadow-sm shrink-0">${h}</span>`;
                        }).join(' ') : `<span class="text-gray-400 text-xs italic">未選択</span>`;

                        return `
                            <div class="flex items-center justify-between py-1 border-b border-gray-100">
                                <div class="flex items-center gap-2">
                                    <span class="horse-badge-arrow">${label}</span>
                                    <div class="flex flex-wrap gap-1">${badges}</div>
                                </div>
                            </div>
                        `;
                    };

                    if (APP_STATE.subMode === "formation") {
                        parentHtml += renderPosBadges("馬1", APP_STATE.selection.pos1);
                        parentHtml += renderPosBadges("馬2", APP_STATE.selection.pos2);
                        if (APP_STATE.currentTicket === "sanrenfuku" || APP_STATE.currentTicket === "sanrentan") {
                            parentHtml += renderPosBadges("馬3", APP_STATE.selection.pos3);
                        }
                    } else if (APP_STATE.subMode === "nagashi") {
                        parentHtml += renderPosBadges("軸", APP_STATE.selection.axis ? [APP_STATE.selection.axis] : []);
                        if (APP_STATE.selection.axis2) parentHtml += renderPosBadges("軸2", [APP_STATE.selection.axis2]);
                        parentHtml += renderPosBadges("相手", APP_STATE.selection.opponents);
                    } else {
                        parentHtml += renderPosBadges("選択", APP_STATE.selection.boxSelected);
                    }

                    const totalGroupCost = combos.length * currentUnit * 100;

                    parentContainer.innerHTML = `
                        <div class="bg-gray-50 p-2.5 rounded-lg border border-gray-200 mb-2">
                            <div class="flex items-center justify-between border-b border-gray-200 pb-1 mb-1">
                                <span class="text-xs font-bold text-gray-700">${APP_STATE.subMode === 'formation' ? 'フォーメーション' : (APP_STATE.subMode === 'box' ? 'ボックス' : 'ながし')}</span>

                            ${parentHtml}

                            </div>
                        </div>
                    `;

                        badgeContainer.classList.add('hidden');
                    } else {
                        badgeContainer.classList.remove('hidden');
                    }
                }
            }

            renderExpandedItems();
            updateTotalCostDisplay();
        }

        function toggleSelection(type, val) {
            if (type === 'boxSingle') {
                const arr = APP_STATE.currentTicket === "tansho_fukusho" ? APP_STATE.selection.singleSelected : APP_STATE.selection.boxSelected;
                const idx = arr.indexOf(val);
                if (idx > -1) arr.splice(idx, 1);
            }
            renderHorseTable();
            updateCombinationsMath();
        }

        function changeSingleAmount(h, diff) {
            let cur = APP_STATE.singleCustomAmounts[h] !== undefined ? APP_STATE.singleCustomAmounts[h] : getCurrentUnitAmount();
            cur = Math.max(1, cur + diff);
            APP_STATE.singleCustomAmounts[h] = cur;
            updateCombinationsMath();
        }

        function setSingleAmountMoney(h, val) {
            let num = Math.max(1, parseInt(val) || 1);
            APP_STATE.singleCustomAmounts[h] = num;
            updateCombinationsMath();
        }

        function toggleExpansion() {
            const badgeContainer = document.getElementById('preview-combinations-badges');
            const expansionBtn = document.getElementById('expansion-btn');

            if (!APP_STATE.isExpanded) {
                APP_STATE.isExpanded = true;
                expansionBtn.innerHTML = '展開を閉じる <i class="fa-solid fa-chevron-up"></i>';
                badgeContainer.classList.remove('hidden');
            } else {
                APP_STATE.isExpanded = false;
                expansionBtn.innerHTML = '展開する <i class="fa-solid fa-chevron-down"></i>';
                badgeContainer.classList.add('hidden');
            }
            updateCombinationsMath();
        }

        function renderExpandedItems() {
            if (APP_STATE.currentTicket === "tansho_fukusho") return;
            const badgeContainer = document.getElementById('preview-combinations-badges');
            const combos = calculateCombinations();
            const count = parseInt(APP_STATE.horseCount);
            const currentUnit = getCurrentUnitAmount();

            const html = combos.map((c, idx) => {
                const item = APP_STATE.expandedItems[idx] || { combo: c, amount: currentUnit };
                const comboStr = c.map(num => {
                    const fNum = getFrameNumber(num, count);
                    const fStyle = FRAME_COLORS[fNum - 1] || FRAME_COLORS[0];

                return `
                    <div class="flex items-center justify-between p-2 bg-white rounded-lg border border-gray-200 shadow-sm w-full my-1">
                        <div class="flex items-center gap-1">${comboStr}</div>
                        <div class="flex items-center gap-1">
                            <button type="button" onclick="triggerIndividualAmountChange(${idx}, -1)" class="w-6 h-6 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded border border-gray-300 text-xs flex items-center justify-center">-</button>
